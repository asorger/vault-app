[package]
name = "vault-app"
version = "0.1.0"
description = "A production-grade offline encrypted desktop file manager"
authors = ["Axel Sorger"]
edition = "2021"
license = "MIT"
readme = "../README.md"

[lib]
name = "vault_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptography
chacha20poly1305 = { version = "0.10", features = ["stream"] }
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# Database
rusqlite = { version = "0.32", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }

# File operations
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
mime_guess = "2"
hex = "0.4"
thiserror = "2"
drag = "2"
zstd = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
rand = "0.8"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
